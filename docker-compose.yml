services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: mypassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mock-oauth2-server:
    image: ghcr.io/navikt/mock-oauth2-server:3.0.1
    ports:
      - "8080:8080"
    environment:
      JSON_CONFIG_PATH: /app/config.json
      LOG_LEVEL: INFO
    volumes:
      - ./mock-oauth2-server/config.json:/app/config.json:ro

volumes:
  pgdata: