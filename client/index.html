<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f4332" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="minhytte" />
    <link
      rel="stylesheet"
      href="https://altinncdn.no/fonts/inter/v4.1/inter.css"
      integrity="sha384-OcHzc/By/OPw9uJREawUCjP2inbOGKtKb4A/I2iXxmknUfog2H8Adx71tWVZRscD"
      crossorigin="anonymous"
    />
    <title>minhytte.app</title>
    <script>
      ;(function () {
        try {
          var s = localStorage.getItem("color-scheme")
          if (s !== "light" && s !== "dark") s = "light"
          document.documentElement.dataset.colorScheme = s
        } catch (_) {
          document.documentElement.dataset.colorScheme = "light"
        }
      })()
    </script>
  </head>
  <body data-color="accent">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
