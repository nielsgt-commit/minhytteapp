# Render Blueprint for minhytteapp.
#
# One production environment: a single Hono Web Service that serves both
# /api/* and the built React SPA from client/dist, plus the Postgres
# database it talks to.
#
# Apply with: Render Dashboard → Blueprints → New Blueprint Instance →
# point at this repo. Render reads render.yaml on every push and reconciles.
#
# Env var ownership:
#   - DATABASE_URL is auto-wired below from the Postgres resource.
#   - BETTER_AUTH_SECRET is auto-generated by Render on first apply and
#     persisted on the service. Never appears in git or in the dashboard
#     by hand. Won't regenerate on subsequent Blueprint syncs.
#   - RESEND_API_KEY is declared here (sync:false) — value lives in the
#     Render dashboard, set manually after first apply.
#   - Everything else lives in the `minhytteapp` env var group in the
#     Render dashboard. Expected keys:
#       NODE_ENV, HOST, BETTER_AUTH_URL, CORS_ORIGIN,
#       MAGIC_LINK_FROM, MET_USER_AGENT

services:
  - type: web
    name: minhytteapp
    runtime: node
    plan: free
    region: frankfurt
    repo: https://github.com/nielsgt-commit/minhytteapp.git
    branch: master
    autoDeployTrigger: commit
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    # Free tier doesn't support preDeployCommand, so migrations run on boot.
    # drizzle-kit migrate is idempotent (tracked via __drizzle_migrations),
    # so re-running on every cold start is a no-op when up-to-date.
    startCommand: pnpm db:migrate && pnpm start
    # /ready runs SELECT 1 against Postgres so DB outages pull the service
    # out of rotation. /health stays as the cheap liveness probe.
    healthCheckPath: /ready
    # Order matters: Render makes the FIRST-listed domain of an apex/www pair
    # the canonical (served) host and auto-redirects the other to it. Apex is
    # listed first so www.minhytte.app 301s to minhytte.app — matching
    # BETTER_AUTH_URL/CORS_ORIGIN. Reversing the order (or adding www first via
    # the dashboard) makes www canonical while the app still forces apex,
    # producing an apex<->www redirect loop (ERR_TOO_MANY_REDIRECTS).
    domains:
      - minhytte.app
      - www.minhytte.app
    envVars:
      - fromGroup: minhytteapp
      - key: DATABASE_URL
        fromDatabase:
          name: minhytteapp_production
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false

databases:
  - name: minhytteapp_production
    plan: free
    region: frankfurt
    postgresMajorVersion: "18"
