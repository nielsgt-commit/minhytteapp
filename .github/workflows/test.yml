name: test

on:
  push:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - 'plans/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'plans/**'

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test
